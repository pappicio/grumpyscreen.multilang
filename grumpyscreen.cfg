[default_macros]
cooldown: TURN_OFF_HEATERS
extrude: _CLIENT_EXTRUDE EXTRUDER_TEMP={} LENGTH={} SPEED={}
retract: _CLIENT_RETRACT EXTRUDER_TEMP={} LENGTH={} SPEED={}
load_filament: C5_LOAD_FILAMENT TEMP={}
unload_filament: UNLOAD_FILAMENT EXTRUDER_TEMP={}

[ui]

adaptive_graph: false

show_automatic_fans: false

spool_remaining: grams   
# Testo sotto il materiale nella pagina bobine.
# percent = PETG #1 80%   (peso rimasto / peso iniziale)
# grams   = PETG #1 803 g (grammi rimasti)
# off     = nessun testo
# Se manca la chiave vale percent.

spool_pie: false
# Disegna il disco della bobina come una fetta di torta che si consuma:
# a 75% vedi 3/4 di disco, partendo dalle ore 12 in senso orario.
# true = fetta attiva, false = disco pieno come prima.
# Se manca la chiave vale true.
# Funziona solo con filamento presente e peso iniziale noto (Spoolman
# collegato ad AFC); altrimenti resta il disco pieno.


# if not defined via environment variable will read this
invert_z_icon: false
prompt_emergency_stop: true

show_screws_tilt: true

# specify -1 for never
display_sleep_sec: -1
# log levels are info, debug, trace
log_level: info
# if not defined via environment variable will read this
display_rotate: 1
# for displaying the current chamber temp
chamber_temp_sensor: heater_generic chamber_heater
# comma-separated extruder panel button values
extruder_temp_presets: 200, 220, 240, 260, 280
extruder_temp_default: 220
extruder_length_presets: 5, 10, 20, 50, 100
extruder_length_default: 10
extruder_speed_presets: 1, 2, 5, 10, 25
extruder_speed_default: 5

# blue = primary_colour: 0x2196F3, secondary_colour: 0xF44336
# green = primary_colour: 0x4CAF50, secondary_colour: 0xF44336
# pink = primary_colour: 0xFEC5E5, secondary_colour: 0xE91E63
# purple = primary_colour: 0x9C27B0, secondary_colour: 0xF44336
# red = primary_colour: 0xF44336, secondary_colour: 0xF44336
# yellow = primary_colour: 0xFFEB3B, secondary_colour: 0xF44336
# The whole palette, all 0xRRGGBB. Every key is required: there are no colours
# in the code to fall back on. To restyle, override keys in your override
# file; you do not need to repeat the ones you keep.
#
# accents: blue = 0x2196F3, green = 0x4CAF50, pink = 0xFEC5E5, purple = 0x9C27B0,
#          red = 0xF44336, yellow = 0xFFEB3B (light accents want a dark
#          on_primary_colour)
language: it
[theme]
primary_colour: 0x2196F3
secondary_colour: 0xF44336
# the page, and panels/cards sitting on it
bg_colour: 0x282B30
surface_colour: 0x282B30
# buttons, and anything lifted off the page
raised_colour: 0x2F3237
# the slot behind the selected nav tab
selected_colour: 0x9E9E9E
border_colour: 0x2F3237
border_dim_colour: 0x616161
text_colour: 0xFAFAFA
text_dim_colour: 0x9E9E9E
# the glyph on a tile at rest (stop, shutdown and the like wear danger_colour)
icon_colour: 0xFFFFFF
disabled_colour: 0x757575
# text and glyphs drawn on the primary colour
on_primary_colour: 0xFFFFFF
danger_colour: 0xD32F2F
warning_colour: 0xFFA000
success_colour: 0x388E3C
info_colour: 0x1976D2

[mmu]
# afc = ArmoredTurtle AFC (BoxTurtle, Canvas, ...), hh = Happy Hare,
# none = no MMU panel at all
backend: afc
# Comma-separated materials for the lane edit screen: the first few show
# inline, the rest appear in the "more materials" popout
materials: PLA, PETG, ABS, TPU, PLA+, PLA-CF, PETG-CF, ABS-CF, ASA, PC, PA, PA-CF, PVA, HIPS, PC-CF, PCTG, ASA-GF, ABS-GF, PETG-GF

#moonraker IP on raspeberry PI
[moonraker]
host: 192.168.1.197 ### or if you are on SOC Version the creator 5 IP 127.0.0.1
port: 7125

# set this if host is not 127.0.0.1 / localhost or you want to download thumbnails

#create the thumbnails folder into grumpyscreen folder it will be used to copy thumbnails from gcode to prewiew on grumpyscreen while printing
thumbnail_path: /usr/data/grumpyscreen/thumbnails 
### thumbnail_path:

[commands]
factory_reset_cmd: /usr/data/grumpyscreen/scripts/unsupported.sh
gui_restart_cmd: /usr/data/grumpyscreen/scripts/restart_gui.sh
switch_to_stock_cmd: /usr/data/grumpyscreen/scripts/unsupported.sh
support_zip_cmd: /usr/data/grumpyscreen/scripts/support_zip.sh
restart_klipper_cmd: /usr/data/grumpyscreen/scripts/restart_klipper.sh
restart_firmware_cmd: /usr/data/grumpyscreen/scripts/restart_firmware.sh
shutdown_host_cmd: /sbin/halt
restart_wifi_cmd: /usr/data/grumpyscreen/scripts/restart_wifi.sh


# Macro buttons (Console -> Macros). A tap runs the macro; one whose
# parameters GrumpyScreen finds in its G-code shows a settings badge, and
# holding it lets you set them before sending.
